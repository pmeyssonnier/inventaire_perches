<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B39">
<meta name="description" content="Inventaire des perches du Patro Sainte-Suzanne : stock, sorties et retours, hors connexion.">
<title>Inventaire des perches</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- Écran de déverrouillage. Rempli par app.js : son contenu change selon
       qu'un code PIN existe déjà ou reste à créer. -->
  <div class="security-screen" id="security-screen" hidden></div>

  <!-- Écran de récupération, affiché quand l'inventaire stocké est illisible.
       Toute écriture est alors bloquée pour ne pas l'écraser. -->
  <div class="security-screen" id="recovery-screen" hidden></div>

  <!-- Vue principale. L'en-tête et les onglets sont statiques : seul
       #tab-content est reconstruit, si bien que le logo n'est chargé qu'une fois. -->
  <div class="wrap" id="main-view" hidden>
    <div class="plate">
      <div class="plate-inner">
        <img class="plate-logo" src="icons/logo.png" width="330" height="214" alt="" decoding="async">
        <div class="plate-title">
          <h1>Perches</h1>
          <p>Inventaire des perches du Patro Sainte-Suzanne</p>
        </div>
        <!-- Verrouiller est une action globale, pas une section. Dans la barre
             d'onglets, elle poussait « Réglages » hors de l'écran sur un
             téléphone : il fallait faire défiler la barre pour la retrouver. -->
        <button class="lock-btn" type="button" id="lock-app">Verrouiller</button>
      </div>
    </div>
    <div class="tabbar">
      <div class="tabs" role="tablist" aria-label="Sections de l’inventaire">
        <button class="tab" type="button" role="tab" id="tab-inventaire" data-tab="inventaire" aria-controls="tab-content" aria-selected="false" tabindex="-1">Inventaire</button>
        <button class="tab" type="button" role="tab" id="tab-sortie" data-tab="sortie" aria-controls="tab-content" aria-selected="false" tabindex="-1">Sortie</button>
        <button class="tab" type="button" role="tab" id="tab-retour" data-tab="retour" aria-controls="tab-content" aria-selected="false" tabindex="-1">Retour</button>
        <button class="tab" type="button" role="tab" id="tab-reglages" data-tab="reglages" aria-controls="tab-content" aria-selected="false" tabindex="-1">Réglages</button>
      </div>
    </div>
    <div id="tab-content" role="tabpanel" tabindex="-1"></div>
  </div>

</div>

<!-- La bulle visuelle porte hidden, qu'un lecteur d'écran ne réveille pas :
     le même texte part dans une région live permanente, hors écran. -->
<div class="toast" id="toast" aria-hidden="true" hidden></div>
<div class="visually-hidden" id="toast-live" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
