<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B39">
<title>Inventaire des perches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #F2F0DC;
    --panel: #FEFDF6;
    --ink: #20291B;
    --ink-soft: #6B6E52;
    --wood: #2F6B39;
    --wood-dark: #204A27;
    --forest: #2F6B39;
    --rust: #C98A00;
    --line: #DAD6AE;
    --danger: #A23B2E;
    --ok-bg: #2F6B39;
    --yellow: #F4C430;
    --yellow-dark: #C98A00;
  }
  *{box-sizing:border-box;}
  #app{
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100%;
    padding:0;
    margin:0;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}

  .plate{
    background:var(--wood);
    color:#F5EFE0;
    border-radius:6px;
    padding:22px 24px;
    margin-bottom:18px;
    border-bottom:5px solid var(--yellow);
  }
  .plate-inner{display:flex;align-items:center;gap:16px;}
  .plate-logo{width:56px;height:auto;flex-shrink:0;border-radius:6px;background:#fff;padding:4px;}
  .plate h1{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .plate p{margin:0;font-size:14px;color:#E7DCC4;}

  .tabs{
    display:flex;
    gap:4px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
    overflow-x:auto;
  }
  .tab{
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink-soft);
    background:none;
    border:none;
    padding:10px 14px 12px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--wood-dark);font-weight:600;border-bottom-color:var(--yellow-dark);}

  .toast{
    font-size:13.5px;
    padding:10px 14px;
    border-radius:5px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .toast.ok{background:#E6EAE2;color:var(--forest);border:1px solid #C6D2BE;}
  .toast.err{background:#F2E1DC;color:var(--danger);border:1px solid #E3C0B6;}

  .legend{margin-bottom:16px;font-size:12.5px;color:var(--ink-soft);}
  .color-group{margin-bottom:18px;}
  .color-group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
    gap:10px;
  }
  .pole-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--wood);
    border-radius:4px;
    padding:12px 12px 10px;
  }
  .pole-card .size{
    font-family:'Roboto Slab', serif;
    font-weight:700;
    font-size:18px;
    line-height:1.1;
  }
  .pole-card .cat{font-size:11px;color:var(--ink-soft);margin:2px 0 8px;}
  .pole-card .stock{font-size:13px;}
  .pole-card .stock b{font-size:15px;}
  .pole-card .bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;}
  .pole-card .bar-fill{height:100%;background:var(--wood);}
  .pole-card .over{color:var(--rust);font-weight:600;}

  .empty{
    background:var(--panel);
    border:1px dashed var(--line);
    border-radius:6px;
    padding:28px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;}
  .card + .card{margin-top:14px;}
  .card h2{font-family:'Roboto Slab', serif;font-size:16px;margin:0 0 14px;font-weight:700;}

  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:5px;}
  select, input[type=number], input[type=text]{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }
  .field{margin-bottom:14px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  button{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
    border-radius:4px;
    border:none;
    padding:10px 18px;
  }
  .btn-primary{background:var(--wood);color:#fff;}
  .btn-primary:hover{background:var(--wood-dark);}
  .btn-ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--ink);}
  .btn-danger{background:none;color:var(--danger);}
  .btn-sm{padding:6px 10px;font-size:13px;}
  button:disabled{opacity:0.45;cursor:not-allowed;}

  .setting-row{
    display:flex;
    flex-direction:column;
    gap:9px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .setting-row:last-child{border-bottom:none;}
  .setting-row-top{display:flex;align-items:center;gap:10px;}
  .setting-row .sz{font-family:'Roboto Slab', serif;font-weight:700;width:78px;flex-shrink:0;}
  .setting-row input{width:80px;flex-shrink:0;}
  .setting-row .spacer{flex:1;}

  .swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .swatch{
    width:20px;height:20px;border-radius:5px;cursor:pointer;
    border:2px solid transparent;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);
  }
  .swatch.selected{border-color:var(--ink);}
  .swatch-auto{
    font-size:11px;color:var(--ink-soft);
    border:1px solid var(--line);border-radius:5px;
    padding:3px 8px;background:#fff;cursor:pointer;height:20px;line-height:12px;
  }
  .swatch-auto.selected{border-color:var(--ink);color:var(--ink);font-weight:600;}
  .color-picker{width:24px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;cursor:pointer;background:none;}

  .foot-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  .muted{color:var(--ink-soft);font-size:12.5px;}

  .history{margin-top:14px;}
  .history h2{font-family:'Roboto Slab', serif;font-size:14px;margin:0 0 10px;font-weight:700;color:var(--ink-soft);}
  .hist-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-row .hist-date{color:var(--ink-soft);font-size:12px;}
  .security-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);}
  .security-card{width:min(100%,390px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;box-shadow:0 12px 35px rgba(32,41,27,.12);}
  .security-card h1{font-family:'Roboto Slab',serif;margin:0 0 8px;font-size:25px;}
  .security-card p{color:var(--ink-soft);font-size:14px;line-height:1.45;margin:0 0 18px;}
  .security-card input{letter-spacing:.25em;text-align:center;font-size:20px;margin-bottom:12px;}
  .security-error{min-height:20px;color:var(--danger);font-size:13px;margin-bottom:8px;}
  .data-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .lock-btn{margin-left:auto;}
  input[type=file]{display:none;}
  @media(max-width:560px){.setting-row-top{flex-wrap:wrap}.setting-row .spacer{flex-basis:100%}.plate h1{font-size:23px}.lock-btn{margin-left:0}}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
  const KEY = 'perches-scouts-inventory';
  const PIN_KEY = 'perches-scouts-pin-v1';
  const BACKUP_KEY = 'perches-scouts-inventory-backup';
  const MAX_IMPORT_BYTES = 1024 * 1024;
  let state = { poles: [], movements: [], activeTab: 'inventaire', loading: true, toast: null, authenticated: false };
  let toastTimer = null;

  const PALETTE = [
    '#E63946','#F3722C','#F9C74F','#FFD60A','#A3CE2D',
    '#43AA8B','#06D6A0','#2A9D8F','#277DA1','#3A86FF',
    '#3A0CA3','#7209B7','#B5179E','#F72585','#9C6644',
    '#6F4518','#808080','#4A4A4A','#000000','#FFFFFF'
  ];
  function colorFor(p){ return p.color || '#C9C0AC'; }
  function hexToHue(hex){
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    if(max === min) return 0;
    const d = max - min;
    let h;
    if(max === r) h = ((g-b)/d) % 6;
    else if(max === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
    return h < 0 ? h + 360 : h;
  }
  function fmtSize(s){ return s.toFixed(2).replace('.',',') + ' m'; }
  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString('fr-BE', {day:'2-digit', month:'2-digit'}) + ' à ' + d.toLocaleTimeString('fr-BE', {hour:'2-digit', minute:'2-digit'});
  }
  function sortedPoles(){ return [...state.poles].sort((a,b)=>a.size-b.size); }
  function findPole(id){ return state.poles.find(p=>p.id===id); }

  async function hashPin(pin){
    const bytes = new TextEncoder().encode(pin);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest), b=>b.toString(16).padStart(2,'0')).join('');
  }
  function validPin(pin){ return /^\d{4,8}$/.test(pin); }
  function hasPin(){ return Boolean(localStorage.getItem(PIN_KEY)); }
  async function unlock(pin, confirmation){
    if(!validPin(pin)){ renderSecurity('Le code PIN doit contenir entre 4 et 8 chiffres.'); return; }
    const hash = await hashPin(pin);
    if(!hasPin()){
      if(pin !== confirmation){ renderSecurity('Les deux codes PIN ne correspondent pas.'); return; }
      localStorage.setItem(PIN_KEY, hash);
    } else if(hash !== localStorage.getItem(PIN_KEY)){
      renderSecurity('Code PIN incorrect.'); return;
    }
    state.authenticated = true;
    load();
  }
  function lock(){
    state.authenticated = false;
    state.toast = null;
    if(toastTimer) clearTimeout(toastTimer);
    renderSecurity();
  }
  async function changePin(){
    const current = prompt('Code PIN actuel :');
    if(current === null) return;
    if(await hashPin(current) !== localStorage.getItem(PIN_KEY)){ showToast('err','Code PIN actuel incorrect.'); return; }
    const next = prompt('Nouveau code PIN (4 à 8 chiffres) :');
    if(next === null) return;
    if(!validPin(next)){ showToast('err','Le nouveau PIN doit contenir entre 4 et 8 chiffres.'); return; }
    const confirmation = prompt('Confirmez le nouveau code PIN :');
    if(next !== confirmation){ showToast('err','Les deux nouveaux codes ne correspondent pas.'); return; }
    localStorage.setItem(PIN_KEY, await hashPin(next));
    showToast('ok','Code PIN modifié.');
  }
  function resetApplication(){
    if(!confirm('PIN oublié ? Cette opération effacera définitivement l’inventaire local et le code PIN. Continuer ?')) return;
    if(!confirm('Dernière confirmation : supprimer toutes les données locales ?')) return;
    localStorage.removeItem(KEY);
    localStorage.removeItem(BACKUP_KEY);
    localStorage.removeItem(PIN_KEY);
    state = { poles: [], movements: [], activeTab: 'inventaire', loading: true, toast: null, authenticated: false };
    renderSecurity();
  }
  function renderSecurity(error=''){
    const setup = !hasPin();
    document.getElementById('app').innerHTML = `<div class="security-screen"><form class="security-card" id="pin-form">
      <h1>${setup ? 'Créer votre code PIN' : 'Inventaire protégé'}</h1>
      <p>${setup ? 'Choisissez un code de 4 à 8 chiffres. Il sera demandé à chaque ouverture de la page.' : 'Saisissez votre code PIN pour accéder à l’inventaire.'}</p>
      <label for="pin">Code PIN</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" autocomplete="${setup?'new-password':'current-password'}" required autofocus>
      ${setup ? '<label for="pin-confirm">Confirmer le code</label><input id="pin-confirm" type="password" inputmode="numeric" pattern="[0-9]{4,8}" maxlength="8" autocomplete="new-password" required>' : ''}
      <div class="security-error">${error}</div><button class="btn-primary" type="submit">${setup ? 'Créer le PIN' : 'Déverrouiller'}</button>
      ${setup ? '' : '<button class="btn-danger btn-sm" id="reset-app" type="button">PIN oublié / réinitialiser</button>'}
    </form></div>`;
    document.getElementById('pin-form').addEventListener('submit',e=>{e.preventDefault();unlock(document.getElementById('pin').value,setup?document.getElementById('pin-confirm').value:'');});
    const resetBtn=document.getElementById('reset-app');
    if(resetBtn) resetBtn.addEventListener('click',resetApplication);
  }
  function normalizeData(data){
    if(!data || typeof data !== 'object' || !Array.isArray(data.poles) || !Array.isArray(data.movements)) throw new Error('format');
    if(data.version != null && data.version !== 1) throw new Error('version');
    if(data.poles.length > 1000 || data.movements.length > 10000) throw new Error('volume');
    const ids = new Set();
    const poles = data.poles.map((raw,index)=>{
      if(!raw || typeof raw !== 'object') throw new Error('perche');
      const size=Number(raw.size), total=Number(raw.total), stock=Number(raw.stock);
      if(!Number.isFinite(size)||size<=0||!Number.isInteger(total)||total<0||!Number.isInteger(stock)||stock<0) throw new Error('valeur');
      const color=raw.color == null ? null : String(raw.color).toUpperCase();
      if(color !== null && !/^#[0-9A-F]{6}$/.test(color)) throw new Error('couleur');
      let id=typeof raw.id==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(raw.id) ? raw.id : 'p'+Date.now()+'_'+index;
      if(ids.has(id)) id='p'+Date.now()+'_'+index;
      ids.add(id);
      return {id,size,total,stock,color};
    });
    const movements = data.movements.map((raw,index)=>{
      if(!raw || typeof raw !== 'object' || !['sortie','retour'].includes(raw.type)) throw new Error('mouvement');
      const size=Number(raw.size), qty=Number(raw.qty);
      if(!Number.isFinite(size)||size<=0||!Number.isInteger(qty)||qty<=0) throw new Error('mouvement');
      const date=new Date(raw.date);
      if(Number.isNaN(date.getTime())) throw new Error('date');
      const id=typeof raw.id==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(raw.id) ? raw.id : 'm'+Date.now()+'_'+index;
      return {id,type:raw.type,size,qty,date:date.toISOString()};
    });
    return {poles,movements};
  }
  function load(){
    try{
      const parsed = JSON.parse(localStorage.getItem(KEY) || '{}');
      if(parsed.poles || parsed.movements){
        const clean=normalizeData({poles:parsed.poles||[],movements:parsed.movements||[]});
        state.poles=clean.poles;
        state.movements=clean.movements;
      } else {
        state.poles=[];
        state.movements=[];
      }
    }catch(e){
      state.poles = [];
      state.movements = [];
    }
    state.loading = false;
    if(state.poles.length === 0) state.activeTab = 'reglages';
    render();
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({version:1,poles:state.poles,movements:state.movements,updatedAt:new Date().toISOString()}));
      return true;
    }catch(e){
      showToast('err', "La sauvegarde a échoué, réessaie.");
      return false;
    }
  }
  function exportJson(){
    const data={version:1,exportedAt:new Date().toISOString(),poles:state.poles,movements:state.movements};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url;a.download=`inventaire-perches-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast('ok','Sauvegarde JSON exportée.');
  }
  function importJson(file){
    if(file.size > MAX_IMPORT_BYTES){ showToast('err','Le fichier dépasse la taille maximale de 1 Mo.'); return; }
    const reader=new FileReader();
    reader.onload=()=>{try{
      const data=JSON.parse(reader.result);
      const clean=normalizeData(data);
      if(!confirm('Remplacer l’inventaire actuel par le contenu de ce fichier ?')) return;
      const previous=localStorage.getItem(KEY);
      if(previous) localStorage.setItem(BACKUP_KEY,previous);
      const oldPoles=state.poles, oldMovements=state.movements;
      state.poles=clean.poles;
      state.movements=clean.movements;
      if(save()) showToast('ok','Inventaire importé avec succès. Une copie de secours a été conservée.');
      else { state.poles=oldPoles; state.movements=oldMovements; }
      render();
    }catch(e){showToast('err','Fichier JSON invalide ou incompatible.');}};
    reader.onerror=()=>showToast('err','Impossible de lire le fichier JSON.');
    reader.readAsText(file);
  }
  function restoreBackup(){
    const raw=localStorage.getItem(BACKUP_KEY);
    if(!raw){ showToast('err','Aucune copie de secours disponible.'); return; }
    if(!confirm('Restaurer l’inventaire présent avant le dernier import ?')) return;
    try{
      const clean=normalizeData(JSON.parse(raw));
      const current=localStorage.getItem(KEY);
      const oldPoles=state.poles, oldMovements=state.movements;
      state.poles=clean.poles;
      state.movements=clean.movements;
      if(save()){
        if(current) localStorage.setItem(BACKUP_KEY,current);
        showToast('ok','Copie de secours restaurée.');
      } else { state.poles=oldPoles; state.movements=oldMovements; }
      render();
    }catch(e){ showToast('err','La copie de secours est invalide.'); }
  }
  function showToast(kind, text){
    state.toast = {kind, text};
    render();
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>{ state.toast = null; if(state.authenticated) render(); }, 3200);
  }

  // ---- actions ----
  function addSize(sizeStr, totalStr){
    const size = parseFloat(String(sizeStr).replace(',','.'));
    const total = parseInt(totalStr, 10);
    if(isNaN(size) || size <= 0){ showToast('err', 'Indique une taille valide, en mètres.'); return; }
    if(isNaN(total) || total < 0){ showToast('err', 'Indique une quantité valide.'); return; }
    if(state.poles.some(p => Math.abs(p.size - size) < 0.001)){
      showToast('err', 'Cette taille existe déjà dans l\'inventaire.'); return;
    }
    const pole={ id: 'p'+Date.now()+Math.random().toString(16).slice(2), size, total, stock: total, color: null };
    state.poles.push(pole);
    if(save()) showToast('ok', `Taille ${fmtSize(size)} ajoutée à l'inventaire.`);
    else state.poles=state.poles.filter(p=>p!==pole);
    if(state.activeTab === 'reglages' && state.poles.length === 1){ /* stay */ }
  }
  function updateTotal(id, totalStr){
    const total = parseInt(totalStr, 10);
    const p = findPole(id);
    if(!p || isNaN(total) || total < 0) return;
    const previous=p.total;
    p.total = total;
    if(!save()) p.total=previous;
  }
  function deletePole(id){
    const previous=state.poles;
    state.poles = state.poles.filter(p=>p.id!==id);
    if(!save()) state.poles=previous;
    render();
  }
  function resetOne(id){
    const p = findPole(id);
    if(!p) return;
    const previous=p.stock;
    p.stock = p.total;
    if(save()) showToast('ok', `Stock des perches ${fmtSize(p.size)} remis à niveau.`);
    else p.stock=previous;
  }
  function resetAll(){
    const previous=state.poles.map(p=>p.stock);
    state.poles.forEach(p=> p.stock = p.total);
    if(save()) showToast('ok', 'Tout le stock a été remis à niveau.');
    else state.poles.forEach((p,i)=>p.stock=previous[i]);
  }
  function checkout(id, qtyStr){
    const p = findPole(id);
    const qty = parseInt(qtyStr, 10);
    if(!p){ showToast('err','Choisis une taille.'); return; }
    if(isNaN(qty) || qty <= 0){ showToast('err','Indique une quantité valide.'); return; }
    if(qty > p.stock){ showToast('err', `Stock insuffisant : ${p.stock} perche(s) de ${fmtSize(p.size)} disponible(s).`); return; }
    p.stock -= qty;
    const movement={ id:'m'+Date.now(), type:'sortie', size:p.size, qty, date:new Date().toISOString() };
    state.movements.unshift(movement);
    if(save()) showToast('ok', `${qty} perche(s) de ${fmtSize(p.size)} sortie(s) du stock.`);
    else { p.stock+=qty; state.movements=state.movements.filter(m=>m!==movement); }
    render();
  }
  function restock(id, qtyStr){
    const p = findPole(id);
    const qty = parseInt(qtyStr, 10);
    if(!p){ showToast('err','Choisis une taille.'); return; }
    if(isNaN(qty) || qty <= 0){ showToast('err','Indique une quantité valide.'); return; }
    if(p.stock+qty>p.total && !confirm(`Le retour portera le stock à ${p.stock+qty}, au-dessus du total déclaré (${p.total}). Continuer ?`)) return;
    p.stock += qty;
    const movement={ id:'m'+Date.now(), type:'retour', size:p.size, qty, date:new Date().toISOString() };
    state.movements.unshift(movement);
    if(save()) showToast('ok', `${qty} perche(s) de ${fmtSize(p.size)} remise(s) en stock.`);
    else { p.stock-=qty; state.movements=state.movements.filter(m=>m!==movement); }
    render();
  }
  function clearHistory(kind){
    const previous=state.movements;
    state.movements = state.movements.filter(m => m.type !== kind);
    if(!save()) state.movements=previous;
    render();
  }

  function tabBtn(id, label){
    return `<button class="tab ${state.activeTab===id?'active':''}" data-tab="${id}">${label}</button>`;
  }

  function renderInventaire(){
    if(state.poles.length === 0){
      return `<div class="empty">Aucune taille enregistrée pour l'instant.<br>Ajoute tes perches depuis l'onglet Réglages pour démarrer l'inventaire.</div>`;
    }
    const groupsMap = {};
    state.poles.forEach(p=>{
      const key = p.color || 'none';
      if(!groupsMap[key]) groupsMap[key] = [];
      groupsMap[key].push(p);
    });
    const groups = Object.keys(groupsMap).map(key=>({
      key, color: key === 'none' ? null : key, poles: groupsMap[key].sort((a,b)=>a.size-b.size)
    }));
    groups.sort((a,b)=>{
      if(!a.color) return 1;
      if(!b.color) return -1;
      return hexToHue(a.color) - hexToHue(b.color);
    });
    const sections = groups.map(g=>{
      const cards = g.poles.map(p=>{
        const color = colorFor(p);
        const pct = p.total > 0 ? Math.min(100, Math.round(100*p.stock/p.total)) : 0;
        const over = p.stock > p.total;
        return `
          <div class="pole-card" style="border-left-color:${color}">
            <div class="size">${fmtSize(p.size)}</div>
            <div class="stock ${over?'over':''}"><b>${p.stock}</b> / ${p.total} dispo</div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          </div>`;
      }).join('');
      const swatch = g.color ? `<span class="dot" style="background:${g.color}"></span>` : `<span class="dot" style="background:#C9C0AC"></span>`;
      const label = g.color ? '' : 'Sans couleur assignée';
      return `
        <div class="color-group">
          <div class="color-group-head">${swatch}${label ? `<span class="muted">${label}</span>` : ''}</div>
          <div class="grid">${cards}</div>
        </div>
      `;
    }).join('');
    return `
      <div class="legend">Les perches sont regroupées par couleur — assigne une couleur à chaque taille depuis Réglages.</div>
      ${sections}
    `;
  }

  function renderMove(kind){
    if(state.poles.length === 0){
      return `<div class="empty">Ajoute d'abord des tailles de perches dans l'onglet Réglages.</div>`;
    }
    const isSortie = kind === 'sortie';
    const options = sortedPoles().map(p=>`<option value="${p.id}">${fmtSize(p.size)} — ${p.stock} dispo</option>`).join('');
    const entries = state.movements.filter(m => m.type === kind).slice(0, 20);
    const histRows = entries.map(m => `
      <div class="hist-row">
        <span>${m.qty} perche(s) de ${fmtSize(m.size)}</span>
        <span class="hist-date">${fmtDate(m.date)}</span>
      </div>
    `).join('');
    return `
      <div class="card">
        <h2>${isSortie ? 'Sortir des perches du stock' : 'Remettre des perches en stock'}</h2>
        <form id="move-form" data-kind="${kind}">
          <div class="field">
            <label for="move-size">Taille</label>
            <select id="move-size">${options}</select>
          </div>
          <div class="field">
            <label for="move-qty">Nombre de perches</label>
            <input type="number" id="move-qty" min="1" value="1">
          </div>
          <button type="submit" class="btn-primary">${isSortie ? 'Sortir du stock' : 'Remettre en stock'}</button>
        </form>
      </div>
      <div class="card history">
        <h2>${isSortie ? 'Historique des sorties' : 'Historique des retours'}</h2>
        ${entries.length ? histRows : `<div class="muted">Aucun mouvement enregistré pour l'instant.</div>`}
        ${entries.length ? `<div class="foot-actions"><span></span><button class="btn-ghost btn-sm" data-clear-hist="${kind}">Effacer l'historique</button></div>` : ''}
      </div>
    `;
  }

  function renderReglages(){
    const rows = sortedPoles().map(p=>{
      const swatches = PALETTE.map(hex => `
        <div class="swatch ${p.color===hex?'selected':''}" style="background:${hex}" data-color-id="${p.id}" data-color-hex="${hex}" title="${hex}"></div>
      `).join('');
      return `
      <div class="setting-row">
        <div class="setting-row-top">
          <div class="sz">${fmtSize(p.size)}</div>
          <div>
            <label style="margin:0 0 2px;font-size:11px;">Total</label>
            <input type="number" min="0" value="${p.total}" data-total-id="${p.id}">
          </div>
          <div class="spacer muted">${p.stock} en stock actuellement</div>
          <button class="btn-ghost btn-sm" data-reset-id="${p.id}">Remettre à niveau</button>
          <button class="btn-danger btn-sm" data-delete-id="${p.id}">Supprimer</button>
        </div>
        <div class="swatches">
          <button type="button" class="swatch-auto ${!p.color?'selected':''}" data-color-id="${p.id}" data-color-hex="">Auto</button>
          ${swatches}
          <input type="color" class="color-picker" data-color-picker-id="${p.id}" value="${p.color || '#C9C0AC'}" title="Choisir une couleur libre">
        </div>
      </div>
    `;}).join('');

    return `
      <div class="card">
        <h2>Tailles enregistrées</h2>
        ${state.poles.length ? rows : '<div class="muted">Aucune taille pour l\'instant — ajoute la première ci-dessous.</div>'}
        ${state.poles.length ? `
          <div class="foot-actions">
            <span class="muted">« Remettre à niveau » restaure le stock au total défini.</span>
            <button class="btn-ghost btn-sm" id="reset-all">Tout remettre à niveau</button>
          </div>` : ''}
      </div>
      <div class="card">
        <h2>Ajouter une taille</h2>
        <form id="add-form">
          <div class="row-2">
            <div class="field">
              <label for="add-size">Taille (en mètres)</label>
              <input type="text" id="add-size" placeholder="ex : 3,20">
            </div>
            <div class="field">
              <label for="add-total">Quantité totale</label>
              <input type="number" id="add-total" min="0" placeholder="ex : 8">
            </div>
          </div>
          <button type="submit" class="btn-primary">Ajouter cette taille</button>
        </form>
      </div>
      <div class="card">
        <h2>Sauvegarde des données</h2>
        <p class="muted">Les données restent sur cet appareil. Exportez régulièrement une copie JSON pour pouvoir les restaurer ou les transférer.</p>
        <div class="data-actions">
          <button type="button" class="btn-primary" id="export-json">Exporter en JSON</button>
          <label for="import-json" class="btn-ghost" style="cursor:pointer">Importer un JSON</label>
          <input type="file" id="import-json" accept="application/json,.json">
          <button type="button" class="btn-ghost" id="restore-backup" ${localStorage.getItem(BACKUP_KEY)?'':'disabled'}>Restaurer avant import</button>
        </div>
      </div>
      <div class="card">
        <h2>Sécurité</h2>
        <div class="data-actions">
          <button type="button" class="btn-ghost" id="change-pin">Modifier le code PIN</button>
          <button type="button" class="btn-ghost" id="lock-settings">Verrouiller maintenant</button>
        </div>
      </div>
    `;
  }

  function attachHandlers(){
    const lockBtn=document.getElementById('lock-app');
    if(lockBtn) lockBtn.addEventListener('click',lock);
    const lockSettings=document.getElementById('lock-settings');
    if(lockSettings) lockSettings.addEventListener('click',lock);
    const changePinBtn=document.getElementById('change-pin');
    if(changePinBtn) changePinBtn.addEventListener('click',changePin);
    const exportBtn=document.getElementById('export-json');
    if(exportBtn) exportBtn.addEventListener('click',exportJson);
    const importInput=document.getElementById('import-json');
    if(importInput) importInput.addEventListener('change',()=>{if(importInput.files[0]) importJson(importInput.files[0]);importInput.value='';});
    const restoreBtn=document.getElementById('restore-backup');
    if(restoreBtn) restoreBtn.addEventListener('click',restoreBackup);
    document.querySelectorAll('.tab[data-tab]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.activeTab = btn.dataset.tab; render(); });
    });

    const moveForm = document.getElementById('move-form');
    if(moveForm){
      moveForm.addEventListener('submit', (e)=>{
        e.preventDefault();
        const kind = moveForm.dataset.kind;
        const id = document.getElementById('move-size').value;
        const qty = document.getElementById('move-qty').value;
        if(kind === 'sortie') checkout(id, qty); else restock(id, qty);
      });
    }

    const addForm = document.getElementById('add-form');
    if(addForm){
      addForm.addEventListener('submit', (e)=>{
        e.preventDefault();
        const size = document.getElementById('add-size').value;
        const total = document.getElementById('add-total').value;
        addSize(size, total);
        render();
      });
    }

    document.querySelectorAll('[data-total-id]').forEach(inp=>{
      inp.addEventListener('change', ()=> updateTotal(inp.dataset.totalId, inp.value));
    });
    document.querySelectorAll('[data-reset-id]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ resetOne(btn.dataset.resetId); render(); });
    });
    document.querySelectorAll('[data-delete-id]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(confirm('Supprimer cette taille de l\'inventaire ?')) deletePole(btn.dataset.deleteId);
      });
    });
    const resetAllBtn = document.getElementById('reset-all');
    if(resetAllBtn){
      resetAllBtn.addEventListener('click', ()=>{
        if(confirm('Remettre tout le stock à niveau ?')) { resetAll(); render(); }
      });
    }
    document.querySelectorAll('[data-clear-hist]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(confirm("Effacer cet historique ?")) clearHistory(btn.dataset.clearHist);
      });
    });
    document.querySelectorAll('[data-color-id]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const p = findPole(el.dataset.colorId);
        if(!p) return;
        p.color = el.dataset.colorHex || null;
        save();
        render();
      });
    });
    document.querySelectorAll('[data-color-picker-id]').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const p = findPole(inp.dataset.colorPickerId);
        if(!p) return;
        p.color = inp.value;
        save();
      });
      inp.addEventListener('change', ()=>{ render(); });
    });
  }

  renderSecurity();
})();
</script>
</body>
</html>
